name: Auto Merge Pull Shark 🦈

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR Automatically
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            console.log(`Processing PR #${pr.number} by @${pr.user.login}`);

            // Beri komentar sambutan
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🦈 **Halo @${pr.user.login}!**\n\nTerima kasih atas kontribusinya! Pull Request kamu otomatis di-merge oleh bot SharkyBed agar kamu segera mendapatkan/menaikkan level badge **Pull Shark** di profil GitHub kamu! 🏆🎉\n\n*Badge Pull Shark biasanya akan muncul dalam beberapa menit di profil GitHub kamu.*`
              });
            } catch (err) {
              console.log("Comment warning:", err);
            }

            // Merge Pull Request
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                commit_title: `feat: merge pull request #${pr.number} from @${pr.user.login} 🦈`,
                merge_method: 'squash'
              });
              console.log(`PR #${pr.number} merged successfully!`);
            } catch (err) {
              console.error("Merge failed:", err);
              core.setFailed(`Failed to auto-merge: ${err.message}`);
            }
